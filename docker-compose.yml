services:
  # production build served by nginx → http://localhost:8080
  web:
    build: { context: ., target: runtime }
    image: vaptlens:latest
    # loopback only by default. To let others on your network sign in, set in .env:
    #   BIND_ADDR=0.0.0.0  and  ALLOWED_HOSTS=<the hostname or IP they type>  (and put HTTPS in front)
    ports: ["${BIND_ADDR:-127.0.0.1}:8080:8080"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    security_opt: ["no-new-privileges:true"]

  # PostgreSQL: all accounts and data. Not published: only the API server reaches it.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaptlens}
      POSTGRES_USER: ${POSTGRES_USER:-vaptlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, e.g. openssl rand -hex 24}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vaptlens} -d $${POSTGRES_DB:-vaptlens}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API server (nginx proxies /api/ here): sign-in, roles, workspaces, audit. Not published: reachable only through nginx.
  # First visit to the app creates the administrator.
  sync:
    build: { context: ., target: sync }
    image: vaptlens-sync:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaptlens}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vaptlens}
      PORT: 8787
      HOST: 0.0.0.0  # inside the compose network only; no host port is published
      TRUST_PROXY: "1"  # nginx sets X-Real-IP for the sign-in rate limit
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}  # set 1 once the app is served over HTTPS
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health',{headers:{host:'localhost'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]

  # Vite dev server with hot reload → http://localhost:5173
  dev:
    profiles: ["dev"]
    build: { context: ., target: dev }
    ports: ["${BIND_ADDR:-127.0.0.1}:5173:5173"]
    volumes:
      - ./src:/src/src
      - ./index.html:/src/index.html
      - ./app:/src/app
      - ./public:/src/public
    environment:
      - CHOKIDAR_USEPOLLING=true
      - SYNC_URL=http://sync:8787

volumes:
  pg-data:
