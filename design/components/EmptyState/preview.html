<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EmptyState — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .box {
        flex: 1;
        min-width: 260px;
        background: var(--surface-100);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { className: "row", style: { alignItems: "stretch" } },
          h(
            "div",
            { className: "box" },
            h(V.EmptyState, {
              title: "No findings match the current filters.",
              action: h(
                V.Button,
                { variant: "ghost", size: "sm" },
                "Clear filters",
              ),
            }),
          ),
          h(
            "div",
            { className: "box" },
            h(V.EmptyState, {
              title: "Load a scan to start.",
              hint: "CSV from Nessus, OpenVAS, Qualys, Burp, ZAP and 5 more. Nothing leaves this browser.",
              action: h(
                V.Button,
                { variant: "primary", size: "sm" },
                "Load demo scan data",
              ),
            }),
          ),
        ),
      );
    </script>
  </body>
</html>
