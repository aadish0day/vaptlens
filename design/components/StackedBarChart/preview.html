<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StackedBarChart — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 13px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { style: { maxWidth: "520px" } },
          h(V.StackedBarChart, {
            labels: ["Nov 2025", "Feb 2026", "Jul 2026"],
            series: [
              {
                label: "0–30 days",
                values: [6, 4, 12],
                color: "var(--heat-2)",
              },
              {
                label: "31–90 days",
                values: [0, 3, 4],
                color: "var(--heat-3)",
              },
              {
                label: "91–180 days",
                values: [0, 2, 3],
                color: "var(--heat-4)",
              },
              { label: "180+ days", values: [0, 0, 3], color: "var(--heat-5)" },
            ],
          }),
        ),
      );
    </script>
  </body>
</html>
