<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QuadrantTile — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          {
            style: {
              display: "grid",
              gridTemplateColumns: "1fr 1fr",
              gap: "12px",
              maxWidth: "520px",
            },
          },
          h(V.QuadrantTile, { kind: "quickwins", count: 8, selected: true }),
          h(V.QuadrantTile, { kind: "strategic", count: 5 }),
          h(V.QuadrantTile, { kind: "mundane", count: 11 }),
          h(V.QuadrantTile, { kind: "deferrable", count: 4 }),
        ),
      );
    </script>
  </body>
</html>
