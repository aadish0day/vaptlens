<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MultiSelect — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { className: "row", style: { alignItems: "flex-start" } },
          h(V.MultiSelect, {
            label: "Tool",
            defaultOpen: true,
            defaultValue: ["Nessus", "Burp Suite"],
            options: [
              { value: "Nessus", count: 21 },
              { value: "Burp Suite", count: 9 },
              { value: "OpenVAS", count: 4 },
              { value: "Nuclei", count: 0 },
            ],
          }),
          h(V.MultiSelect, { label: "Host" }),
        ),
      );
    </script>
  </body>
</html>
