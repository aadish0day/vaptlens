<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ReportHeader — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { className: "col" },
          h(V.ReportHeader, {
            theme: "slate",
            meta: "Scope: 3 scan batches · 10.100.0.0/16 · Generated 2026-07-01 · Confidential",
          }),
          h(
            "div",
            { className: "row", style: { alignItems: "stretch" } },
            h(
              "div",
              { style: { flex: 1 } },
              h(V.ReportHeader, {
                theme: "navy",
                title: "Scope & Methodology",
              }),
            ),
            h(
              "div",
              { style: { flex: 1 } },
              h(V.ReportHeader, {
                theme: "crimson",
                title: "Top 20 Unpatched Risks",
              }),
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
