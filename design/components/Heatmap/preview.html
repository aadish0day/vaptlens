<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Heatmap — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { style: { maxWidth: "560px" } },
          h(V.Heatmap, {
            rows: [
              { host: "10.100.1.10", values: [3, 2, 4, 1, 2] },
              { host: "10.100.2.12", values: [1, 1, 2, 0, 3] },
              { host: "10.100.1.25", values: [0, 1, 3, 2, 5] },
              { host: "app.internal.corp", values: [0, 3, 6, 1, 4] },
            ],
          }),
        ),
      );
    </script>
  </body>
</html>
