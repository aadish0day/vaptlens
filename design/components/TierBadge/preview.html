<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TierBadge — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 13px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { className: "row" },
          h(V.TierBadge, { tier: 1 }),
          h(V.TierBadge, { tier: 2 }),
          h(V.TierBadge, { tier: 3 }),
          h(V.TierBadge, { tier: 1, short: true }),
        ),
      );
    </script>
  </body>
</html>
