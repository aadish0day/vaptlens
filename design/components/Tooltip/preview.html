<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tooltip — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { className: "row", style: { paddingTop: "40px" } },
          h(
            V.Tooltip,
            { content: "CVSS 9.8 · NVD base score" },
            h(V.Button, { size: "sm" }, "9.8"),
          ),
          h(
            V.Tooltip,
            { content: "Opens NVD in a new tab", side: "bottom" },
            h(V.Button, { variant: "ghost", size: "sm" }, "CVE-2021-41773"),
          ),
        ),
      );
    </script>
  </body>
</html>
