<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SeverityBadge — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { className: "col" },
          h(
            "div",
            { className: "row" },
            ["critical", "high", "medium", "low", "info"].map(function (s) {
              return h(V.SeverityBadge, { key: s, severity: s });
            }),
          ),
          h(
            "div",
            { className: "row" },
            [
              ["critical", 4],
              ["high", 9],
              ["medium", 14],
              ["low", 6],
              ["info", 11],
            ].map(function (s) {
              return h(V.SeverityBadge, {
                key: s[0],
                severity: s[0],
                count: s[1],
              });
            }),
          ),
        ),
      );
    </script>
  </body>
</html>
