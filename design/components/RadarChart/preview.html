<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RadarChart — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 13px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(V.RadarChart, {
          axes: [
            "Exploitable",
            "KEV",
            "Zero-day",
            "Ransomware",
            "EOL",
            "SLA breach",
          ],
          series: [
            {
              label: "Q1 2026",
              values: [4, 3, 0, 5, 3, 2],
              color: "var(--chart-6)",
              dashed: true,
            },
            { label: "Q2 2026", values: [8, 6, 2, 6, 4, 7] },
          ],
        }),
      );
    </script>
  </body>
</html>
