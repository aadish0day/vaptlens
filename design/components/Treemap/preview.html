<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Treemap — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 13px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { style: { maxWidth: "560px" } },
          h(V.Treemap, {
            data: [
              { label: "A05 Security Misconfiguration", value: 18 },
              { label: "A06 Vulnerable Components", value: 14 },
              { label: "A03 Injection", value: 8 },
              { label: "A01 Broken Access Control", value: 7 },
              { label: "A02 Cryptographic Failures", value: 6 },
              { label: "A07 Auth Failures", value: 3 },
            ],
          }),
        ),
      );
    </script>
  </body>
