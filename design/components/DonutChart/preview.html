<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DonutChart — preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var V = window.VAPTLens,
        h = React.createElement;
      function R(el) {
        ReactDOM.createRoot(document.getElementById("root")).render(el);
      }
      R(
        h(
          "div",
          { className: "row", style: { gap: "32px" } },
          h(V.DonutChart, {
            data: [
              { label: "Critical", value: 12, severity: "critical" },
              { label: "High", value: 31, severity: "high" },
              { label: "Medium", value: 58, severity: "medium" },
              { label: "Low", value: 22, severity: "low" },
              { label: "Info", value: 40, severity: "info" },
            ],
          }),
          h(V.DonutChart, {
            totalLabel: "findings",
            data: [
              { label: "Nessus", value: 96, color: "var(--chart-1)" },
              { label: "Burp Suite", value: 41, color: "var(--chart-2)" },
              { label: "OpenVAS", value: 18, color: "var(--chart-3)" },
              { label: "Other", value: 8, color: "var(--chart-6)" },
            ],
          }),
        ),
      );
    </script>
  </body>
</html>
