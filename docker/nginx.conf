# VAPTLens: nginx serves the built app and proxies /api/ to the VAPTLens server (server/server.mjs),
# which stores workspace data in PostgreSQL. (add_header does not inherit into a location that sets
# its own, so every location includes the same security headers.)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API server. Resolved per request (Docker DNS) so nginx starts before it; until then this returns 502.
  # The original Host goes through so the server's ALLOWED_HOSTS check (DNS-rebinding guard) sees it;
  # X-Real-IP feeds the sign-in rate limit (the server trusts it only with TRUST_PROXY=1).
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;  # API paths carry workspace names; the server logs route patterns instead
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $sync http://sync:8787;
    proxy_pass $sync;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;  # keep in step with MAX_BYTES in server/server.mjs
  }

  # fingerprinted build assets: cache for a year
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # the app shell: always revalidate so a new build is picked up
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
